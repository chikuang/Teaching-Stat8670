<script>
  document.addEventListener("DOMContentLoaded", function () {

    document
    .querySelectorAll('div.solution.proof[id^="sol-"]')
    .forEach(function (solution) {

      // Get Quarto's automatically generated title,
      // e.g. "Solution 2.1"
      const proofTitle = solution.querySelector(".proof-title");

      let titleText = "Solution";

      if (proofTitle) {
        titleText = proofTitle.textContent
          .trim()
          .replace(/\.$/, "");

        // Remove the original inline title
        proofTitle.remove();
      }

      // Create collapsible <details>
      const details = document.createElement("details");
      details.className = "solution-collapse";

      // Keep the original ID so cross-references still work
      details.id = solution.id;

      const summary = document.createElement("summary");
      summary.textContent = titleText;

      const body = document.createElement("div");
      body.className = "solution-collapse-body";

      // Move the original solution contents into the collapsible body
      while (solution.firstChild) {
        body.appendChild(solution.firstChild);
      }

      // Remove an empty first paragraph if Quarto leaves one behind
      const firstParagraph = body.querySelector(":scope > p:first-child");

      if (
        firstParagraph &&
        firstParagraph.textContent.trim() === "" &&
        firstParagraph.children.length === 0
      ) {
        firstParagraph.remove();
      }

      details.appendChild(summary);
      details.appendChild(body);

      solution.replaceWith(details);
    });

});
</script>
