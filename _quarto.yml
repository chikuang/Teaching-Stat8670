project:
  type: book

book:
  title: "STAT 8670 -- Computational Methods in Statistics"
  output-file: "STAT-8670-Computational-Methods-in-Statistics"
  subtitle: "2026 Fall Course Notes"
  author: "Chi-Kuang Yeh"
  date: today
  chapters:
    - index.qmd
    - 01-R.qmd
    - 02-computation.qmd
    - 03-optimization.qmd
    - 04-generating-rv.qmd
    - part: "Assignment"
      chapters:
        - Assignment1.qmd
        - Assignment2.qmd
        - Assignment3.qmd
    - part: "Exam"
      chapters:
        - Exam1-2026F.qmd
        - Exam1-2025F.qmd
    - part: "Project"
      chapters:
        - Project-Instructions.qmd
        - Project-Report.qmd
        - Project-Package.qmd
        - Project-Presentation.qmd
  navbar:
    right:
      - icon: github
        href: https://github.com/chikuang/Teaching-Stat8670/tree/2026F
        aria-label: GitHub

      - icon: file-pdf
        href: STAT-8670-Computational-Methods-in-Statistics.pdf
        aria-label: Download PDF



bibliography: references.bib

# Preserve the archived exam answers in the combined PDF as well as HTML.
show-exam-solutions: true

execute:
  cache: true
  freeze: auto

format:
  html:
    theme:
      - minty
      - brand
    css: custom-callouts.css
    filters:
      - addcalloutid.lua
    cache: true
  pdf:
    documentclass: scrreprt
    monofont: Menlo
    fig-pos: H
    colorlinks: true
    linkcolor: CourseAccent
    urlcolor: CourseAccent
    citecolor: CourseAccent
    toccolor: CourseAccent
    filecolor: CourseAccent
    geometry:
      - margin=1in
      - headheight=38pt
      - headsep=12pt
      - footskip=36pt
    include-in-header:
      - pdf-environments.tex
      - pdf-page-style.tex
    filters:
      - addcalloutid.lua
      - filters/pdf-callouts.lua
      - filters/pdf-layout.lua
      - filters/course-links.lua
    cache: true

editor: source
